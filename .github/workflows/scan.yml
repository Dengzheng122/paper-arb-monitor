name: 跨链套利扫描

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 扫描跨链候选
        run: python3 scripts/scan.py

      - name: 自动验证候选（CoinGecko）
        run: python3 scripts/verify.py

      - name: 提交结果
        run: |
          git config user.name "arb-bot"
          git config user.email "arb-bot@users.noreply.github.com"
          git add docs/state/
          git diff --cached --quiet || git commit -m "scan: $(date -u +%FT%TZ)"
          git push
